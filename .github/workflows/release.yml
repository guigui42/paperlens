name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperlens-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.release.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate immutable stable release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-assets.py validate "$REF_TYPE" "$TAG"
          image="ghcr.io/${REPOSITORY,,}"
          printf 'image=%s\ntag=%s\n' "$image" "$TAG" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          python3 scripts/release-assets.py check-new "$TAG" "$RUNNER_TEMP/existing-releases.json"

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build native image with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Smoke-test exact published digest on its native CPU
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/smoke-docker.sh "$IMAGE@$DIGEST" --pull
      - name: Record validated platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assemble validated multiarchitecture manifest
        id: manifest
        run: |
          amd64="$(cat "$RUNNER_TEMP/digests/amd64.txt")"
          arm64="$(cat "$RUNNER_TEMP/digests/arm64.txt")"
          sources=(
            --annotation "index:org.opencontainers.image.description=Paperlens with bundled Copilot CLI"
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          )
          docker buildx imagetools create --dry-run "${sources[@]}" > "$RUNNER_TEMP/index.json"
          expected="$(python3 scripts/release-assets.py manifest-digest "$RUNNER_TEMP/index.json")"
          if docker buildx imagetools inspect "$IMAGE:$TAG" > "$RUNNER_TEMP/existing-image.txt" 2>/dev/null; then
            existing="$(awk '$1 == "Digest:" {print $2; exit}' "$RUNNER_TEMP/existing-image.txt")"
            test "$existing" = "$expected" || { echo "Refusing to overwrite an existing version tag"; exit 1; }
          fi
          version="${TAG#v}"
          minor="${version%.*}"
          docker buildx imagetools create "${sources[@]}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:$version" -t "$IMAGE:$minor" -t "$IMAGE:latest"
          actual="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          test "$actual" = "$expected"
          printf 'digest=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$actual" --raw > "$RUNNER_TEMP/published-index.json"
          python3 scripts/release-assets.py verify-platforms "$RUNNER_TEMP/published-index.json"
      - name: Sign release-image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Create checksummed deployment assets
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          python3 scripts/release-assets.py assets \
            --tag "$TAG" --image "$IMAGE" --digest "$DIGEST" \
            --revision "$GITHUB_SHA" \
            --amd64 "$(cat "$RUNNER_TEMP/digests/amd64.txt")" \
            --arm64 "$(cat "$RUNNER_TEMP/digests/arm64.txt")" \
            --output "$RUNNER_TEMP/release"
          PAPERLENS_IMAGE="$IMAGE@$DIGEST" PAPERLESS_URL=https://paperless.example.com \
            docker compose -f "$RUNNER_TEMP/release/compose.release.yaml" config --quiet
      - name: Publish GitHub release after both native smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/release/"* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Paperlens $TAG" --notes-file "$RUNNER_TEMP/release/RELEASE.md"
          {
            printf '## Paperlens %s\n\n' "$TAG"
            printf 'Image: `%s@%s`\n\n' "$IMAGE" "$(cat "$RUNNER_TEMP/release/image-reference.txt" | cut -d@ -f2)"
            printf 'Native smoke tests passed on linux/amd64 and linux/arm64.\n'
          } >> "$GITHUB_STEP_SUMMARY"
